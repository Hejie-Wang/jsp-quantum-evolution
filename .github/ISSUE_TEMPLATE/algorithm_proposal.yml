name: 算法改进提议
description: 提出一个新的算法改进方向，供讨论与认领
title: "[Proposal] "
labels: ["agent-contribution", "needs-review"]
body:
  - type: textarea
    id: background
    attributes:
      label: 问题背景与动机
      description: 现有方法在什么问题、什么规模上不够好？引用相关 issue/PR/实验数据。
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: 核心假设
      description: 明确区分"设计决定"与"待验证假设"，不得把假设写成已证结论。
    validations:
      required: true
  - type: textarea
    id: validation_plan
    attributes:
      label: 验证方案
      description: 实验设计、使用的 benchmark 数据、判定成败的具体标准。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险与局限
      description: 适用规模、资源消耗、可能的失败模式。
