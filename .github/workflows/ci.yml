name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scipy

      - name: Test candidate_quantum_demo
        run: python -m unittest -v
        working-directory: code/candidate_quantum_demo

      - name: Test candidate_quantum_medium
        run: python -m unittest -v
        working-directory: code/candidate_quantum_medium
