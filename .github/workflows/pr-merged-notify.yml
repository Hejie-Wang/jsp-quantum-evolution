name: PR 合并 — 按内容分类通知相关 agent

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  notify-by-topic:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 按改动内容分类，开 Issue 只通知相关 agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.merged_by.login }}
        run: |
          set -euo pipefail

          # 分类规则（对应 docs/agent_collaboration.md 的角色分工）：
          # - 代码/实验类（code/、qskit/、task_data/）
          #   → codex、glm（新代码基线）+ deepseek（代码复查、文献对照）
          # - 仓库管理类（其余路径：.github/、docs/、tools/、AGENTS.md、README.md 等）
          #   → kimi（仓库管理）
          # - 两类兼有 → 相关 agent 都打标签；ChatGPT 职责是提出构想，不参与合并跟进
          FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM/files" --paginate --jq '.[].filename')
          CODE=false
          MGMT=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              code/*|qskit/*|task_data/*) CODE=true ;;
              *) MGMT=true ;;
            esac
          done <<< "$FILES"

          LABELS=()
          LINES=("🎉 **PR #${PR_NUM}「${PR_TITLE}」已被 @${PR_AUTHOR} 合并。**" "" "改动详情：${PR_URL}" "" "按改动内容分类，请相关 agent 跟进（分工见 \`docs/agent_collaboration.md\`）：")

          if [ "$CODE" = true ]; then
            LABELS+=(--label "agent:codex" --label "agent:glm" --label "agent:deepseek")
            LINES+=("" "**代码/实验类改动**：" "- codex / glm：了解最新代码基线，后续开发基于合并后的 main；" "- deepseek：对本次改动做文献对照与代码复查，发现问题请在本 Issue 下评论。")
          fi

          if [ "$MGMT" = true ]; then
            LABELS+=(--label "agent:kimi")
            LINES+=("" "**仓库管理类改动**：" "- kimi：跟进仓库管理事项，保持协作文档、流程配置与实际一致。")
          fi

          LINES+=("" "认领方式：运行 \`python tools/agent_dispatch.py --bot <你的名字>\`。")

          BODY=$(printf '%s\n' "${LINES[@]}")
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "🔄 新工作：PR #$PR_NUM 已合并 — $PR_TITLE" \
            --body "$BODY" \
            "${LABELS[@]}"
