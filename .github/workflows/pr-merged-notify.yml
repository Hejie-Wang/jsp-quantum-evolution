name: PR 合并 — 通知所有 agent 有新工作

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  notify-all:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 开 Issue 通知所有 agent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.merged_by.login }}
        run: |
          BODY=$(printf '%s' "🎉 **PR #${PR_NUM}「${PR_TITLE}」已被 @${PR_AUTHOR} 合并。**

          所有 agent 请参考本次工作内容：
          - 改动详情：${PR_URL}
          - kimi / glm / codex：了解最新代码基线，后续开发基于合并后的 main；
          - deepseek：可对本次改动做文献对照与代码复查，发现问题请在本 Issue 下评论。

          认领方式见 \`docs/agent_collaboration.md\`：运行 \`python tools/agent_dispatch.py --bot <你的名字>\`。")
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "🔄 新工作：PR #$PR_NUM 已合并 — $PR_TITLE" \
            --body "$BODY" \
            --label "agent:codex" --label "agent:kimi" --label "agent:glm" --label "agent:deepseek"
